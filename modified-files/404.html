<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — MechHub</title>
<meta name="description" content="The page you're looking for doesn't exist. Return to MechHub.">
<meta name="theme-color" content="#151515">
<link rel="icon" href="/MechLibrary/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/MechLibrary/favicon.ico" sizes="48x48">
<style>
:root{--ink:#151515;--green:#168447;--green-l:#22A45D;--paper:#F5F6F5;--on-dark:#fff;--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--ink);color:var(--on-dark);font:16px/1.6 var(--font);-webkit-text-size-adjust:100%}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.content{max-width:480px}
.glyph{font-size:6rem;line-height:1;margin-bottom:8px;color:var(--green-l)}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 12px}
p{color:#A9B0AB;margin:0 0 32px;font-size:1.05rem}
a.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:8px;background:var(--green);color:#fff;font-size:1rem;font-weight:600;text-decoration:none;transition:background .2s}
a.btn:hover{background:#126B3A}
a.btn svg{width:18px;height:18px;flex:none}
footer{padding:20px;text-align:center;font-size:.85rem;color:#4F5651}
</style>
</head>
<body>
<main>
  <div class="content">
    <div class="glyph" aria-hidden="true">⚙</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved. Head back to MechHub to find your courses.</p>
    <a class="btn" href="/MechLibrary/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      Back to MechHub
    </a>
  </div>
</main>
<footer>MechHub &mdash; Mechanical Engineering Study Hub</footer>
</body>
</html>
